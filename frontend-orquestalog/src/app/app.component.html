<header class="app-nav" *ngIf="auth.isLoggedIn()">
  <a class="brand" routerLink="/dashboard">OrquestaLog</a>

  <nav class="nav-links">
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/ordenes" routerLinkActive="active">Órdenes</a>
  </nav>

  <div class="nav-user">
    <span class="user-chip">{{ auth.getPayload()?.nombre }} · {{ etiquetaRol() }}</span>
    <button type="button" class="btn btn-secondary btn-sm" (click)="cerrarSesion()">Salir</button>
  </div>
</header>

<main class="container">
  <router-outlet></router-outlet>
</main>
