<div class="page-header">
  <h2>Órdenes</h2>
  <div class="toolbar">
    <input class="input" type="search" name="busqueda" [(ngModel)]="busqueda" placeholder="Buscar por ID, descripción o estado">
    <button *ngIf="auth.hasRole('admin', 'gestor')" type="button" class="btn btn-primary" routerLink="/ordenes/nueva">
      + Nueva orden
    </button>
  </div>
</div>

<div class="card">
  <div *ngIf="cargando" class="state">Cargando órdenes...</div>

  <div *ngIf="error" class="alert-error">{{ error }}</div>

  <div *ngIf="!cargando && !error" class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Descripción</th>
          <th>Fecha</th>
          <th>Estado</th>
          <th class="actions">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let orden of ordenesFiltradas">
          <td class="id">#{{ orden.id }}</td>
          <td>{{ orden.descripcion }}</td>
          <td class="muted">{{ orden.fecha_creacion | date:'shortDate' }}</td>
          <td>
            <span [ngClass]="'badge badge--' + orden.estado">{{ orden.estado.replace('_', ' ') }}</span>
          </td>
          <td class="actions">
            <button type="button" class="btn btn-ghost btn-sm" [routerLink]="['/ordenes/detalle', orden.id]">Ver</button>
            <button *ngIf="auth.hasRole('admin', 'gestor')" type="button" class="btn btn-ghost btn-sm" [routerLink]="['/ordenes/editar', orden.id]">Editar</button>
            <button *ngIf="auth.hasRole('admin')" type="button" class="btn btn-danger-text btn-sm" (click)="eliminarOrden(orden.id)">Eliminar</button>
          </td>
        </tr>

        <tr *ngIf="ordenesFiltradas.length === 0">
          <td colspan="5" class="state">No se encontraron órdenes.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
