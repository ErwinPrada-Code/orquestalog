<div class="card card-narrow">
  <h2 style="margin-bottom: 20px;">{{ isEdit ? 'Editar orden' : 'Nueva orden' }}</h2>

  <div *ngIf="error" class="alert-error">{{ error }}</div>

  <form class="form" (ngSubmit)="guardarOrden()" #ordenForm="ngForm">

    <div class="field">
      <label for="descripcion">Descripción de la carga</label>
      <input id="descripcion" class="input" type="text" name="descripcion" [(ngModel)]="orden.descripcion" required maxlength="255" placeholder="Ej. Lote de monitores">
    </div>

    <div class="field">
      <label for="centro">Centro de distribución</label>
      <select id="centro" class="input" name="centro_distribucion_id" [(ngModel)]="orden.centro_distribucion_id" required>
        <option *ngFor="let c of centros" [ngValue]="c.id">{{ c.nombre }}</option>
      </select>
    </div>

    <div class="field">
      <label for="flota">Flota / vehículo asignado</label>
      <select id="flota" class="input" name="flota_id" [(ngModel)]="orden.flota_id" required>
        <option *ngFor="let f of flotas" [ngValue]="f.id">{{ f.nombre }} (capacidad {{ f.capacidad }})</option>
      </select>
    </div>

    <div class="field">
      <label for="ruta">Ruta a seguir</label>
      <select id="ruta" class="input" name="ruta_id" [(ngModel)]="orden.ruta_id" required>
        <option *ngFor="let r of rutas" [ngValue]="r.id">{{ r.origen }} → {{ r.destino }}</option>
      </select>
    </div>

    <div class="field" *ngIf="isEdit">
      <label for="estado">Estado</label>
      <select id="estado" class="input" name="estado" [(ngModel)]="orden.estado" required>
        <option *ngFor="let e of estados" [ngValue]="e.valor">{{ e.etiqueta }}</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" routerLink="/ordenes">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="!ordenForm.valid || cargando">
        {{ cargando ? 'Guardando...' : (isEdit ? 'Actualizar orden' : 'Guardar orden') }}
      </button>
    </div>

  </form>
</div>
