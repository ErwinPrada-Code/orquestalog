<div class="auth-wrap">
  <div class="card auth-card">
    <h1>OrquestaLog</h1>
    <p class="muted">Sistema de orquestación logística</p>

    <form class="form" (ngSubmit)="iniciarSesion()">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input id="email" class="input" type="email" name="email" [(ngModel)]="email" required autocomplete="username" placeholder="admin@orquestalog.com">
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" class="input" type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" placeholder="••••••••">
      </div>

      <div *ngIf="error" class="alert-error" style="margin-bottom: 0;">{{ error }}</div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
