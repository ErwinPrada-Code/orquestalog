<div style="display: flex; justify-content: center; align-items: center; height: 80vh;">
  <div style="background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center;">
    <h2 style="margin-top: 0; color: #333;">📦 OrquestaLog</h2>
    <p style="color: #666; margin-bottom: 25px;">Sistema Logístico</p>

    <form (ngSubmit)="iniciarSesion()" style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
      <div>
        <label style="font-weight: bold; display: block; margin-bottom: 5px;">Correo Electrónico</label>
        <input type="email" name="email" [(ngModel)]="email" required placeholder="admin@orquestalog.com" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
      </div>

      <div>
        <label style="font-weight: bold; display: block; margin-bottom: 5px;">Contraseña</label>
        <input type="password" name="password" [(ngModel)]="password" required placeholder="******" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
      </div>

      <div *ngIf="error" style="color: red; font-size: 14px; text-align: center;">
        {{ error }}
      </div>

      <button type="submit" [disabled]="cargando" style="background-color: #000; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;">
        {{ cargando ? 'Iniciando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
